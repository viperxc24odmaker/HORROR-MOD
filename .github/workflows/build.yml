name: Build HORROR-MOD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build mod
        run: gradle build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: horror-mod-build
          path: build/libs/*.jar
          if-no-files-found: error
